# Alertmanager: where alerts go. Default: Slack, via an incoming-webhook URL stored ON THE SERVER in
#   /opt/monitoring/secrets/alertmanager/slack_webhook_url   (never commit the URL - it is a secret)
# Create the webhook: Slack -> Apps -> Incoming Webhooks -> Add to channel.
route:
  receiver: slack
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: slack
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        text: >-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ if .Annotations.runbook }}Runbook: {{ .Annotations.runbook }}{{ end }}
          {{ end }}

# Email instead of (or as well as) Slack: add to the receiver above, and keep the password in a file
# on the server (it is mounted at /etc/alertmanager/secrets):
#   email_configs:
#     - to: oncall@example.com
#       from: alerts@example.com
#       smarthost: smtp.example.com:587
#       auth_username: alerts@example.com
#       auth_password_file: /etc/alertmanager/secrets/smtp_password
#       send_resolved: true

inhibit_rules:
  # while something is critical, do not also send its warnings
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [instance]
