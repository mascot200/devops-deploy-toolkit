# Daily drift check: does real AWS still match Terraform? Fails (and GitHub emails you) when someone
# changed something by hand in the console. Read-only: uses the read-only role, never applies.
# Copy to .github/workflows/drift.yml. Needs repository variables AWS_REGION and AWS_READONLY_ROLE_ARN.
name: drift

on:
  schedule:
    - cron: "17 6 * * 1-5" # weekdays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  drift:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      TF_DIR: infra/envs/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_READONLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - name: Drift check (exit 3 = drift)
        run: |
          printf 'TF_DIR=%s\n' "$TF_DIR" >"deploy/targets.$ENVIRONMENT.env"
          terraform -chdir="$TF_DIR" init -input=false -no-color >/dev/null
          # compare against the version that is deployed, not a new one
          TF_VAR_image_tag="$(terraform -chdir="$TF_DIR" output -raw image_tag)"
          export TF_VAR_image_tag
          rc=0
          bash deploy/scripts/terraform.sh drift || rc=$?
          if [ "$rc" = 3 ]; then
            echo "### DRIFT in $ENVIRONMENT - someone changed AWS outside Terraform. Ask Claude: 'use the drift-auditor agent on $ENVIRONMENT'" >>"$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
